
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup - Bhumi Raksha</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                🌱 Bhumi Raksha
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Start your land restoration journey
            </p>

            <form id="signupForm">

                <label>Full Name</label>
                <input 
                    type="text" 
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <label>Email</label>
                <input 
                    type="email" 
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>
                <input 
                    type="password" 
                    id="password"
                    placeholder="Create password"
                    required
                >

                <label>Confirm Password</label>
                <input 
                    type="password" 
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >

                <button type="submit">
                    Create Account →
                </button>

            </form>

            <p class="bottom-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

    <script src="signup.js"></script>

</body>
</html>
