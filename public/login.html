
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Bhumi Raksha</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                🌱 Bhumi Raksha
            </div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Continue your land restoration journey
            </p>

            <form id="loginForm">

                <label>Email</label>
                <input 
                    type="email" 
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>
                <input 
                    type="password" 
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Login →
                </button>

            </form>

            <p class="bottom-text">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
